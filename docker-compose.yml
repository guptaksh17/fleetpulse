services:
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 10s

  kafka-init:
    image: apache/kafka:3.7.0
    container_name: kafka-init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic oem.inbound --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic vehicle.raw --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic vehicle.normalized --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic vehicle.alerts --partitions 3 --replication-factor 1 &&
      /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --topic vehicle.dlq --partitions 3 --replication-factor 1 &&
      echo 'All 5 Kafka topics created with 3 partitions each.'
      "

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      # Host port 6380: a locally installed Redis on 6379 would otherwise shadow this one for host tools.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 10
      start_period: 2s

  postgres:
    image: postgres:16-alpine
    container_name: postgres
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: fleetpulse
      POSTGRES_USER: fleetpulse
      POSTGRES_PASSWORD: fleetpulse
    volumes:
      - ./db/postgres/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetpulse -d fleetpulse"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: timescaledb
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: fleetpulse
      POSTGRES_USER: fleetpulse
      POSTGRES_PASSWORD: fleetpulse
    volumes:
      - ./db/timescale/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fleetpulse -d fleetpulse"]
      interval: 3s
      timeout: 3s
      retries: 15
      start_period: 5s

  simulator:
    build:
      context: ./simulator
    container_name: simulator
    restart: unless-stopped
    volumes:
      - ./configs:/app/configs:ro
      - ./data:/app/data
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: oem.inbound
      EMIT_INTERVAL_SEC: "1.0"
      CONFIG_PATH: "${CONFIG_PATH:-}"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fleetpulse
      POSTGRES_USER: fleetpulse
      POSTGRES_PASSWORD: fleetpulse
      INJECT_DTC_CODE: "${INJECT_DTC_CODE:-}"
      INJECT_DTC_AFTER_S: "${INJECT_DTC_AFTER_S:-60}"
      INJECT_DTC_DURATION_S: "${INJECT_DTC_DURATION_S:-10}"
      DUPLICATE_RATE: "${DUPLICATE_RATE:-0.0}"
      START_SEQ: "${START_SEQ:-0}"
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  identity-resolver:
    build:
      context: ./services/identity-resolver
    container_name: identity-resolver
    restart: unless-stopped
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_INBOUND_TOPIC: oem.inbound
      KAFKA_OUTBOUND_TOPIC: vehicle.raw
      KAFKA_GROUP_ID: identity-resolver-group
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fleetpulse
      POSTGRES_USER: fleetpulse
      POSTGRES_PASSWORD: fleetpulse
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  normalization:
    build:
      context: ./services/normalization
    container_name: normalization
    restart: unless-stopped
    volumes:
      - ./contracts:/contracts:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_RAW_TOPIC: vehicle.raw
      KAFKA_NORMALIZED_TOPIC: vehicle.normalized
      KAFKA_GROUP_ID: normalization-group
      CANONICAL_SCHEMA_PATH: /contracts/canonical/vehicle_event.schema.json
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully

  stream-processor:
    build:
      context: .
      dockerfile: services/stream-processor/Dockerfile
    container_name: stream-processor
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_NORMALIZED_TOPIC: vehicle.normalized
      KAFKA_GROUP_ID: stream-processor
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      DEDUP_WINDOW_SECONDS: "900"
      BLOOM_CAPACITY: "1000000"
      BLOOM_FP_RATE: "0.01"
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      TIMESCALE_DB: fleetpulse
      TIMESCALE_USER: fleetpulse
      TIMESCALE_PASSWORD: fleetpulse
      BATCH_SIZE: "500"
      POLL_TIMEOUT_MS: "200"
      FEATURES_ENABLED: "${FEATURES_ENABLED:-true}"
      CONTEXT_REFRESH_SECONDS: "60"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fleetpulse
      POSTGRES_USER: fleetpulse
      POSTGRES_PASSWORD: fleetpulse
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      timescaledb:
        condition: service_healthy

  rule-engine:
    build:
      context: ./services/rule-engine
    container_name: rule-engine
    restart: unless-stopped
    volumes:
      - ./contracts:/contracts:ro
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_NORMALIZED_TOPIC: vehicle.normalized
      KAFKA_ALERTS_TOPIC: vehicle.alerts
      KAFKA_GROUP_ID: rule-engine
      DTC_REGISTRY_PATH: /contracts/dtc/dtc_registry.yaml
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_DB: fleetpulse
      POSTGRES_USER: fleetpulse
      POSTGRES_PASSWORD: fleetpulse
    depends_on:
      kafka:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: api
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      TIMESCALE_HOST: timescaledb
      TIMESCALE_PORT: "5432"
      REDIS_HOST: redis
      MODEL_REPORT_PATH: /app/data/models/m1/report.json
      STREAM_METRICS_URL: http://stream-processor:8080/metrics
    volumes:
      - ./data/models:/app/data/models:ro
    depends_on:
      postgres:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: ./frontend
      args:
        API_URL: http://api:8000
    container_name: web
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy

  scorer:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    container_name: scorer
    restart: unless-stopped
    command: ["python", "-m", "ml.score", "live", "--models", "/app/data/models/m1", "--interval", "1"]
    volumes:
      - ./data:/app/data:ro
    environment:
      POSTGRES_DSN: "host=postgres port=5432 dbname=fleetpulse user=fleetpulse password=fleetpulse"
      REDIS_HOST: redis
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

